version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talksy_postgres
    restart: always
    environment:
      POSTGRES_USER: talksy
      POSTGRES_PASSWORD: talksy_secret
      POSTGRES_DB: talksy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talksy -d talksy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talksy_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    container_name: talksy_server
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://talksy:talksy_secret@postgres:5432/talksy_db?schema=public
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/app/uploads
      - PUBLIC_SERVER_URL=http://localhost:4000
      - PUBLIC_WEB_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: talksy_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  uploads_data:
